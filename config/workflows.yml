workflows:
  omniagent-dev:
    profile: null
    # Provider/model are defined by the CHANNEL, never by the workflow
    # (user rule 2026-08-14). The rerun resolution in fail_thread.rs falls
    # through to thread.provider (channel-derived) when this is null.
    provider: null
    model: null
    plan_mode: null
    retries: 3
    clear_executions_on_review: true
    roles:
      executor:
        # Template is a FILE NAME resolved against
        # profiles/<profile>/templates/<name>.md (e.g. omni ->
        # profiles/omni/templates/dev-executor.md).
        template: dev-executor
        profile: null
        provider: null
        model: null
        plan_mode: null
        retries: 3
      reviewer:
        template: dev-reviewer
        profile: null
        provider: null
        model: null
        plan_mode: on
        retries: 9
      tester:
        template: dev-tester
        profile: null
        provider: null
        model: null
        plan_mode: on
        retries: 3
  wf_probe_final:
    profile: null
    provider: null
    model: null
    plan_mode: off
    retries: 1
    clear_executions_on_review: false
    roles:
      executor:
        template: null
        profile: null
        provider: noop
        model: test-tool-caller
        plan_mode: null
        retries: null
