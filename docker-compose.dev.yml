# Dev overlay: adds cargo build capabilities to the omniagent container
# and binds source mounts for the dashboard.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  omniagent:
    build:
      context: /opt/workspace/omniagent
      dockerfile: Dockerfile.dev
    image: omniagent-dev:latest
    env_file: []
    command: /target/release/omniagent
    environment:
      CARGO_TARGET_DIR: /target
      # Dev builds validate queries against the live DB (SQLX_OFFLINE=false),
      # so code + migrations can change on the fly without a stale .sqlx cache.
      SQLX_OFFLINE: "false"
      # Force the dev stack onto ITS OWN postgres (project omnidev,
      # separate volume) via the dev-only alias `omnidev-postgres`;
      # a dev binary can never resolve to the omni-stack (production)
      # DB. The db-migrations DB-write guard allows schema writes only
      # to known dev hosts, and the bare `postgres` service name
      # (which the production omni-stack uses too) is refused.
      DATABASE_URL: postgres://omniagent:${POSTGRES_PASSWORD:-}@omnidev-postgres:5432/omniagent
    dns:
      - 8.8.8.8
    volumes:
      - /opt/workspace/omniagent:/app:rw
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target

  dashboard:
    build:
      context: /opt/workspace/omni-dashboard
      dockerfile: Dockerfile
    # The image copies the compiled backend to /app/server; /opt/repo is the
    # source bind mount and does not contain generated server-dist output.
    command: ["node", "/app/server/index.js"]
    # Dev-only host access: publish dashboard + mattermost to the host here,
    # never in the base compose (host ports are a shared, finite resource).
    ports:
      - "12345:3001"
    volumes:
      # Keep the production dependencies installed in the image. Mounting the
      # host node_modules can hide them (and the host may not have them).
      - /opt/workspace/omni-dashboard:/opt/repo:rw

  toolbox:
    # Source build for the toolbox (the base compose is image-only). The
    # Dockerfile lives in this repo's services/toolbox directory.
    build:
      context: ./services/toolbox
      dockerfile: Dockerfile

  mattermost:
    ports:
      - "12346:8065"

  paperclip:
    ports:
      - "3101:3100"

  postgres:
    # Dev-only network alias for the DB-write guard: schema writes
    # are only allowed to known dev hosts, so the dev stack must
    # reach its postgres via `omnidev-postgres`, never the ambiguous
    # bare `postgres` service name (used by the production
    # omni-stack too).
    networks:
      default:
        aliases:
          - omnidev-postgres

networks:
  default:
    driver: bridge

volumes:
  cargo-registry:
  cargo-target:
