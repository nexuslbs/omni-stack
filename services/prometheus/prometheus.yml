global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'cadvisor'
    # cadvisor's first fs-scan can take minutes on hosts with many containers
    # (the /var/lib/docker mount), blowing the default 10s timeout.
    # Note: prometheus requires scrape_timeout <= scrape_interval.
    scrape_interval: 240s
    scrape_timeout: 180s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host:9100']
