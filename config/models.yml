# Provider/model overrides — pure definition file (NO plugin code).
# Loaded from {OMNI_DIR}/config/models.yml at startup. Absent/empty = zero
# behavior change. Malformed = startup fails with a clear error.
#
# Semantics:
#   providers.<name>.plugin  true/name -> use the provider plugin (plugins.yml);
#                            false     -> builtin chat_completions/anthropic support
#   providers.<name>.models  replaces the plugin's default_model.allowed_values
#                            in selectors (channels page, providers page, /models)
#   Provider-level fields (api_mode, supports_reasoning, default_base_url,
#     refresh_url, default_model, api_key, token_budget_*, max_tokens*) override
#     the plugin config.
#   model_config.<model>     per-model overrides — highest precedence.
#
# Precedence for EACH of soft/hard token budget INDEPENDENTLY:
#   model_config.<model> > providers.<name> > global settings
#   (prompt_token_budget_soft default 100000 / hard 500000).
# max_tokens / max_tokens_on_truncation follow the same chain.
#
# api_key supports $env:VAR and $secret:NAME (same expansion as plugins.yml).
#
# The code-less providers below (deepseek, openai, opencode-go, noop) are
# PLUGIN-LESS: they no longer ship as plugin.json files in the omniagent image
# (removed from the repo — see task "Move code-less provider plugins out of
# omniagent"). Their canonical definitions live at the ROOT of the omni-plugins
# repo (models.yml) and are mirrored here so this stack resolves them via
# omniagent's builtin chat_completions/anthropic support.

providers:
  # DeepSeek — plugin-less, builtin chat_completions support.
  # Fixes the (previously hardcoded) model list without any plugin file.
  deepseek:
    plugin: false
    api_mode: "chat_completions"
    supports_reasoning: true
    default_base_url: "https://api.deepseek.com/v1"
    refresh_url: "https://api.deepseek.com/v1/models"
    default_model: "deepseek-v4-flash"
    api_key: "$secret:DEEPSEEK_API_KEY"
    models: ["deepseek-v4-flash", "deepseek-v3", "deepseek-r1", "deepseek-v4-pro"]

  # OpenAI — plugin-less, builtin chat_completions support.
  openai:
    plugin: false
    api_mode: "chat_completions"
    default_base_url: "https://api.openai.com/v1"
    refresh_url: "https://api.openai.com/v1/models"
    default_model: "gpt-4o"
    api_key: "$secret:OPENAI_API_KEY"
    models: ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo", "gpt-4.1"]

  # OpenCode Go — plugin-less gateway provider. The legacy "dynamic" api_mode
  # from the old plugin.json is NOT carried over; chat_completions is used
  # (OpenAI-compatible surface). For models served on the Anthropic surface
  # (MiniMax/Qwen), add model_config.<model>.api_mode: "anthropic".
  opencode-go:
    plugin: false
    api_mode: "chat_completions"
    supports_reasoning: true
    default_base_url: "https://opencode.ai/zen/go/v1"
    refresh_url: "https://opencode.ai/zen/go/v1/models"
    default_model: "deepseek-v4-flash"
    api_key: "$secret:OPENCODE_API_KEY"
    models: ["deepseek-v4-flash"]

  # noop — plugin-less test provider (no API key; the noop-provider container
  # server at http://noop-provider:9090/v1 is separate from any plugin file).
  noop:
    plugin: false
    api_mode: "chat_completions"
    default_base_url: "http://noop-provider:9090/v1"
    default_model: "test-model-1"
    models: ["test-model-1", "test-model-2"]

  # Plugin-less provider: works via builtin chat_completions/anthropic support.
  # No plugin needed — appears in provider selects and can be used on threads.
  # my_provider_01:
  #   plugin: false
  #   api_mode: "chat_completions"
  #   supports_reasoning: true
  #   default_base_url: "http://noop-provider:9090/v1"
  #   refresh_url: "https://api.deepseek.com/v1/models"
  #   default_model: "test-model-1"
  #   api_key: "$secret:MY_SECRET"
  #   models: ["my_model_01", "my_model_02", "my_model_03"]
  #   model_config:
  #     my_model_02:
  #       api_mode: "anthropic"
  #       supports_reasoning: false
  #       token_budget_soft: 200000
  #       token_budget_hard: 1000000
  #       max_tokens: 32000
  #       max_tokens_on_truncation: 128000
