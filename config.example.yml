# Omni Stack - example configuration
#
# Copy this file to `config.yml` (gitignored, like .env) and adjust values.
# setup.sh (repo root) reads the `repo` key to know which repository to clone
# into /opt/omni on a fresh machine. In the Vagrant flow the file lives next to
# the Vagrantfile and is copied into /opt/secrets/ on the VM; in the remote
# flow you place it at /opt/secrets/config.yml yourself.

# Repository to clone into /opt/omni on a fresh VM / remote host.
# Public: https://github.com/nexuslbs/omni-stack
# Private via SSH: git@github.com:nexuslbs/omni-stack.git (uses the forwarded
# SSH agent in Vagrant, or a key installed on the remote machine).
repo: https://github.com/nexuslbs/omni-stack

# Optional: token for cloning a PRIVATE repository over HTTPS (e.g. a GitHub
# personal access token with `repo` scope). Leave empty ("") to use the GitHub
# App auto-mint below instead (recommended). The token is used only for the
# initial clone, is never stored in /opt/omni/.git/config, and is never printed
# to logs.
repo_token: ""

# GitHub App auto-mint (recommended for private repos - nothing to manage):
# when `repo_token` is empty, setup.sh mints a FRESH installation token on
# every run from the nexuslbs GitHub App credentials below, so provisioning
# never fails from an expired token. The private key file must be placed in
# /opt/secrets/ (file name is the value of `github_app_private_key`, as today;
# the Vagrantfile copies it from next to the Vagrantfile automatically) and
# never leaves the machine - only the short-lived token is used to clone.
github_app_id: 3967918
github_installation_id: 138119822
github_app_private_key: "nexuslbs-app.private-key.pem"

# Optional: top-level `secrets:` dict. Each entry is registered via the
# omniagent API (POST /secrets {name, value}) after the stack starts.
# secrets:
#   OPENAI_API_KEY: sk-...
#   ANTHROPIC_API_KEY: sk-ant-...

# VM resource defaults (used by the Vagrantfile).
vm:
  name: "omniagent-vm"
  memory: 8192
  cpus: 2
  disk: "200GB"
