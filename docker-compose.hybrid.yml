# Hybrid deploy overlay: builds the PRODUCTION images locally (like CI
# would), then deploy.py runs the full deploy + test cycle against them.
#
# Usage (deploy.py runs this itself; manual equivalent):
#   docker compose -f docker-compose.yml -f docker-compose.hybrid.yml \
#     --env-file /opt/workspace/omni-deployer/omni.env -p omnideploy build
#
# Why this overlay exists:
#   - The base compose builds omniagent from Dockerfile.dev (the dev
#     toolchain image: cargo + keepalive, NO runtime binary). Hybrid/CI
#     must build the production Dockerfile (builder stage runs
#     fmt/check/clippy/test against the committed .sqlx offline cache).
#   - The dashboard service has no build section in the base compose
#     (image-only, pulled from GHCR in stable); hybrid must build it
#     locally so the whole stack runs on freshly-built production images.
#   - toolbox already has a build section in the base compose
#     (context ./services/toolbox, dockerfile Dockerfile) — no override
#     needed here.
services:
  omniagent:
    build:
      context: ${WORKSPACE_DIR:-/opt/workspace}/omniagent
      dockerfile: Dockerfile
  dashboard:
    build:
      context: ${WORKSPACE_DIR:-/opt/workspace}/omni-dashboard
      dockerfile: Dockerfile
