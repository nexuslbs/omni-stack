# Dev overlay: adds cargo build capabilities to the omniagent container
# and binds source mounts for the dashboard.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# IMAGE NAMES: every service that BUILDS in this overlay declares an EXPLICIT
# image name in the local/ namespace. The base compose is image-only and its
# defaults are the PUBLISHED images (ghcr.io/nexuslbs/...), so a merged build
# would otherwise re-tag a published name with the local build. The local/ tags
# keep a local build apart from the published image (dashboard/toolbox reuse the
# names deploy.py hybrid builds; workbench -> local/workbench).
services:
  omniagent:
    build:
      context: /opt/workspace/omniagent
      dockerfile: Dockerfile.dev
    # Explicit local image name (see the header): Dockerfile.dev is NOT the
    # published production image, so a dev build must never re-tag it.
    image: omniagent-dev:latest
    env_file: []
    command: /target/release/omniagent
    environment:
      CARGO_TARGET_DIR: /target
      # Dev builds validate queries against the live DB (SQLX_OFFLINE=false),
      # so code + migrations can change on the fly without a stale .sqlx cache.
      SQLX_OFFLINE: "false"
      # Force the dev stack onto ITS OWN postgres (project omnidev,
      # separate volume) via the dev-only alias `omnidev-postgres`;
      # a dev binary can never resolve to the omni-stack (production)
      # DB. The db-migrations DB-write guard allows schema writes only
      # to known dev hosts, and the bare `postgres` service name
      # (which the production omni-stack uses too) is refused.
      DATABASE_URL: postgres://omniagent:${POSTGRES_PASSWORD:-}@omnidev-postgres:5432/omniagent
    # Dev builds are far hungrier than the runtime: deploy.py pretests run
    # `cargo check/clippy --workspace --all-targets --release`, where a single
    # rustc on the omniagent crate peaks at ~1.9 GB anon-rss and cargo runs 2
    # jobs in parallel (nproc=2). The base compose 2g cap made the kernel
    # OOM-kill rustc/clippy-driver inside the container cgroup
    # (CONSTRAINT_MEMCG) and aborted the deploy. Dev gets more headroom;
    # production keeps the base 1024m cap (see the 4 GB stack budget in
    # docker-compose.yml).
    mem_limit: 4g
    dns:
      - 8.8.8.8
    volumes:
      - /opt/workspace/omniagent:/app:rw
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target

  dashboard:
    build:
      context: /opt/workspace/omni-dashboard
      dockerfile: Dockerfile
    # Explicit local image name (see the header).
    image: local/omni-dashboard:latest
    # The image copies the compiled backend to /app/server; /opt/repo is the
    # source bind mount and does not contain generated server-dist output.
    command: ["node", "/app/server/index.js"]
    # Dev-only host access: publish dashboard + mattermost to the host here,
    # never in the base compose (host ports are a shared, finite resource).
    ports:
      - "12345:3001"
    volumes:
      # Keep the production dependencies installed in the image. Mounting the
      # host node_modules can hide them (and the host may not have them).
      - /opt/workspace/omni-dashboard:/opt/repo:rw

  toolbox:
    # Source build for the toolbox (the base compose is image-only). The
    # Dockerfile lives in this repo's services/toolbox directory.
    build:
      context: ./services/toolbox
      dockerfile: Dockerfile
    # Explicit local image name (see the header).
    image: local/omni-toolbox:latest

  mattermost:
    ports:
      - "12346:8065"

  paperclip:
    ports:
      - "3101:3100"

  postgres:
    # Dev-only network alias for the DB-write guard: schema writes
    # are only allowed to known dev hosts, so the dev stack must
    # reach its postgres via `omnidev-postgres`, never the ambiguous
    # bare `postgres` service name (used by the production
    # omni-stack too).
    networks:
      default:
        aliases:
          - omnidev-postgres

  workbench:
    # Dev-only source build: the base compose is IMAGE-ONLY; the image is built
    # here from services/workbench/Dockerfile (build-time clone of the core repo
    # via WORKBENCH_REPO_URL / WORKBENCH_REF).
    build:
      context: ./services/workbench
      dockerfile: Dockerfile
      args:
        WORKBENCH_REPO_URL: ${WORKBENCH_REPO_URL:-https://github.com/nexuslbs/workbench}
        WORKBENCH_REF: ${WORKBENCH_REF:-main}
    # Explicit local image name: the image is built ON THE FLY here, so it is
    # tagged local/workbench:latest - never the published
    # ghcr.io/nexuslbs/workbench:latest of the base compose.
    image: local/workbench:latest
    # Dev config: the tracked config.yml of the workbench-plugins checkout, read
    # through the base compose /opt:/opt mount (same path in and out). It loads
    # the core plugins from the sibling /opt/workspace/workbench core checkout
    # and THIS repository's plugins from the LOCAL path source
    # /opt/workspace/workbench-plugins/plugins (no clone, no push): production
    # uses the remote git source of config/workbench.yml instead.
    environment:
      CONFIG_FILE: /opt/workspace/workbench-plugins/config.yml
      # The dev stack is launched from THIS checkout, not from /opt/omni: the
      # `container` transport execs into a sibling service of the stack that
      # owns this container and derives its compose project directory from
      # ${env:OMNI_DIR} (plugins config: himalaya -> toolbox).
      OMNI_DIR: ${WORKBENCH_OMNI_DIR:-/opt/workspace/omni-stack}
    # Dev-only host access: host 12347 -> the container's INTERNAL port 8080
    # (the base compose is expose-only and never publishes a host port).
    ports:
      - "12347:8080"

  workstation:
    # Dev-only source build: the base compose is IMAGE-ONLY; the image is built
    # here from services/workstation/Dockerfile (build-time clone of the core repo
    # via WORKSTATION_REPO_URL / WORKSTATION_REF).
    build:
      context: ./services/workstation
      dockerfile: Dockerfile
      args:
        WORKSTATION_REPO_URL: ${WORKSTATION_REPO_URL:-https://github.com/nexuslbs/deepseek-harness}
        WORKSTATION_REF: ${WORKSTATION_REF:-master}
    # Explicit local image name: the image is built ON THE FLY here, so it is
    # tagged local/workstation:latest - never the published
    # ghcr.io/nexuslbs/workstation:latest of the base compose.
    image: local/workstation:latest
    # Dev config: the tracked dev config of THIS repo (config/workstation.dev.yml),
    # read through the base compose /opt:/opt mount (same path in and out). It
    # loads every capability plugin from the LOCAL workbench-plugins checkout
    # /opt/workspace/workbench-plugins (no clone, no push): production uses the
    # plugin sources on the `workstation-cache` named volume instead.
    environment:
      CONFIG_FILE: /opt/workspace/omni-root/config/workstation.dev.yml
      # The dev stack is launched from the omni-stack checkout, not from
      # /opt/omni: the `container` transport execs into a sibling service of the
      # stack that owns this container and derives its compose project directory
      # from ${env:OMNI_DIR} (plugins config: himalaya -> toolbox).
      OMNI_DIR: ${WORKSTATION_OMNI_DIR:-/opt/workspace/omni-stack}
    # Dev-only host access: host 12348 -> the container's INTERNAL port 8080
    # (the base compose is expose-only and never publishes a host port).
    ports:
      - "12348:8080"

networks:
  default:
    driver: bridge

volumes:
  cargo-registry:
  cargo-target:
